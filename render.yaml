services:
  - type: web
    name: labhub-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/init_db.py && python scripts/seed_demo.py && waitress-serve --host=0.0.0.0 --port=$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: LABHUB_SECRET_KEY
        generateValue: true
      - key: LABHUB_DATABASE_URI
        value: sqlite:///site.db
      - key: LABHUB_LOG_FILE
        value: logs/error.log
      - key: LABHUB_SEED_DEMO_DATA
        value: "true"
      - key: LABHUB_AUTO_LOGIN_DEMO
        value: "true"
